# Runs zero-dependency Node 22 tests for server/compile-service (Docker images are built locally only).
name: Test K-Comp Compile Service

on:
  push:
    branches: ["main"]
    paths:
      - "server/compile-service/**"
      - ".github/workflows/compile-server.yml"
  pull_request:
    paths:
      - "server/compile-service/**"
      - ".github/workflows/compile-server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "compile-server-test-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test-service:
    name: Zero-Dep Node 22 Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run compile-service unit & HTTP integration tests
        working-directory: server/compile-service
        run: node --test server.test.mjs
